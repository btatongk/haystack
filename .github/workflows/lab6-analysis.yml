name: Lab6 - Static Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - semester-investigation
      - "lab6-*"

permissions:
  contents: read

jobs:
  static-analysis:
    name: Ruff and duplication baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Run Ruff and preserve JSON
        shell: bash
        run: |
          mkdir -p lab6-artifacts
          hatch run ruff check haystack --output-format json > lab6-artifacts/ruff.json || true
          hatch run ruff check haystack --statistics > lab6-artifacts/ruff-summary.txt || true

      - name: Run jscpd
        run: npx --yes jscpd haystack --format json --output lab6-artifacts --min-lines 10 --min-tokens 50

      - name: Print baseline artifact summaries
        shell: bash
        run: |
          echo "Ruff findings:"
          cat lab6-artifacts/ruff-summary.txt
          echo "Artifacts:"
          ls -lh lab6-artifacts

      - name: Upload Lab 6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab6-static-analysis
          path: lab6-artifacts
          if-no-files-found: error
